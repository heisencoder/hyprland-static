name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      # Version CI packages just below the next release (e.g. 0.56.2-3~ci57
      # before v0.56.2-3), so installing one upgrades from the last release
      # and the release later upgrades from it.
      - name: Choose the package version
        id: version
        run: |
          read -r tag revision < <(scripts/next-release.sh)
          echo "revision=${revision}~ci${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Build, test and package
        env:
          DEB_REVISION: ${{ steps.version.outputs.revision }}
        run: ./build.sh

      # Compare the static dependencies in Hyprland's actual link commands
      # with the declared list and the release notes (tests marked "build").
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Check the static dependencies against the release notes
        run: uv run --locked pytest -m build --no-cov -v

      - name: Show the release notes in the run summary
        run: cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - uses: ./.github/actions/save-caches
        if: always()

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: hyprland-static-deb
          path: |
            out/*.deb
            out/release-notes.md
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: logs/
