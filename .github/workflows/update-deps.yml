name: Update dependencies

# Daily: move the submodules in src/ to their newest upstream releases and
# open (or refresh) a pull request for review.  CI builds and tests it.
# Nothing is merged or released automatically.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write       # push the update branch
  pull-requests: write  # open the PR
  actions: write        # approve the PR's CI runs

concurrency:
  group: update-deps

env:
  BRANCH: deps/update
  GH_TOKEN: ${{ github.token }}
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # Asked to review, and assigned, every update PR (so GitHub emails them).
  REVIEWER: heisencoder

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      # Always build the update on main, even when started from another
      # branch (say, to try out a change to this workflow).
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive

      # Once someone has pushed their own commits to the update branch (say,
      # to fix the build for a new Hyprland), stop refreshing it.
      - name: Check for an update PR with manual changes
        id: existing
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          held=false
          if [ -n "$pr" ] && git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            if git log --format=%ae "origin/main..origin/$BRANCH" | grep -qvF "$BOT_EMAIL"; then
              held=true
              echo "::notice::PR #$pr has manual commits; leaving it alone"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"

      - name: Move submodules to their latest releases
        id: update
        if: steps.existing.outputs.held != 'true'
        run: python3 -m scripts.update_deps --out "$RUNNER_TEMP/update" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          PR: ${{ steps.existing.outputs.pr }}
          OUT: ${{ runner.temp }}/update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git switch -c "$BRANCH"
          git add src .gitmodules
          git commit -q -F "$OUT/commit.txt"

          # Skip the push (and a needless CI run) if the open PR already has
          # exactly these versions.  Without an open PR, push and open one even
          # if the branch is current: an earlier run may have pushed it and
          # then failed to open the PR.
          if [ -n "$PR" ] &&
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null &&
            git diff --quiet "origin/$BRANCH" HEAD; then
            echo "PR #$PR is already up to date"
            exit 0
          fi
          git push -f origin "$BRANCH"

          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$(cat "$OUT/title.txt")" --body-file "$OUT/summary.md" \
              --add-reviewer "$REVIEWER" --add-assignee "$REVIEWER"
          elif ! gh pr create --base main --head "$BRANCH" \
              --title "$(cat "$OUT/title.txt")" --body-file "$OUT/summary.md" \
              --reviewer "$REVIEWER" --assignee "$REVIEWER"; then
            echo "::error::Couldn't open the PR.  If GitHub Actions isn't permitted to create pull requests, allow it in Settings > Actions > General > Workflow permissions."
            exit 1
          fi

          # Checks on a PR from the workflow's own token wait for approval
          # (they show as "action_required").  They check the commit made
          # above, so approve them.  Only the PR's own runs (not ones started
          # with "gh workflow run") count as its required checks.
          sha=$(git rev-parse HEAD)
          for workflow in ci.yml python.yml; do
            for _ in $(seq 30); do
              run=$(gh run list --workflow "$workflow" --commit "$sha" --event pull_request \
                --json databaseId,conclusion --jq '.[0] // empty')
              [ -n "$run" ] && break
              sleep 5
            done
            if [ -z "$run" ]; then
              echo "::warning::$workflow didn't start for the PR"
            elif [ "$(jq -r .conclusion <<<"$run")" = action_required ]; then
              gh api --silent -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .databaseId <<<"$run")/approve"
              echo "Approved $workflow for the PR"
            fi
          done
