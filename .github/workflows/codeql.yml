name: CodeQL

# CodeQL code scanning of the Python scripts and the workflows themselves.
# This replaces the repository's CodeQL "default setup", which doesn't run
# on Dependabot's pull requests, so their required "Analyze (...)" checks
# never appeared.  Default setup must be off (Settings > Code security >
# CodeQL analysis > Switch to advanced), or the analysis uploads are refused.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # The job names "Analyze (actions)" and "Analyze (python)" are required
    # status checks for main.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write  # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      # Same category as default setup used, so alerts carry over.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
